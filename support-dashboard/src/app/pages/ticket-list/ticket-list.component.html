<h2>Tickets</h2>

@if (loading) {
  <p>Chargement...</p>
} @else if (error) {
  <p>{{ error }}</p>
} @else {
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Titre</th>
        <th>Statut</th>
        <th>Priorite</th>
        <th>Assigne a</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (ticket of tickets; track ticket.id) {
        <tr>
          <td>{{ ticket.title }}</td>
          <td>{{ ticket.status }}</td>
          <td>{{ ticket.priority }}</td>
          <td>{{ ticket.assignee }}</td>
          <td>
            <a [routerLink]="['/tickets', ticket.id]">Voir</a>
            <a [routerLink]="['/tickets', ticket.id, 'edit']">Modifier</a>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucun ticket.</td>
        </tr>
      }
    </tbody>
  </table>
}
